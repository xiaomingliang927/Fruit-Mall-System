server:
  port: 8080

spring:
  application:
    name: fruit-mall-backend
  datasource:
    # 密钥一律走环境变量（默认值仅供本地开发）；createDatabaseIfNotExist 免去手动建库
    url: jdbc:mysql://${FRUIT_DB_HOST:localhost}:${FRUIT_DB_PORT:3306}/${FRUIT_DB_NAME:fruit_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${FRUIT_DB_USER:root}
    password: ${FRUIT_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有表结构的老库：首次接入 Flyway 时打基线（跳过 V1/V2），此后只应用新增迁移
    baseline-on-migrate: true
    baseline-version: 2
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

app:
  jwt:
    # HS256 签名密钥：生产环境必须通过环境变量 FRUIT_JWT_SECRET 注入并定期轮换
    secret: ${FRUIT_JWT_SECRET:fruit-mall-dev-jwt-secret-change-me-please-0123456789abcdef}
    expire-hours: 168
  wechat:
    # 小程序 AppID/Secret；两者都配置后走真实 code2Session，留空则进入开发模式（openid = dev-<code>）
    appid: ${FRUIT_WX_APPID:wxa0baa0a3ac856f2d}
    # TODO: 填入小程序 AppSecret（mp.weixin.qq.com → 开发管理 → 开发设置），
    #       填入后同一微信用户在任意设备登录都会得到同一 openid，实现跨设备账号互通
    secret: ${FRUIT_WX_SECRET:}
