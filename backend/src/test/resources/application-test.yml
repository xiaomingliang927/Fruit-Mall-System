# 集成测试专用：H2 内存库（MySQL 兼容模式），Flyway 跑 V1/V2 建库+种子
spring:
  datasource:
    url: jdbc:h2:mem:fruitmall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true

app:
  jwt:
    secret: test-only-secret-test-only-secret-0123456789abcdef
    expire-hours: 1
  wechat:
    appid: ""
    secret: ""
