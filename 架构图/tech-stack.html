<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f8fafc; padding:36px; color:#1e293b; }
  .canvas { width:880px; margin:0 auto; display:flex; flex-direction:column; gap:13px; }
  .row { background:#fff; border:2px solid #e2e8f0; border-radius:16px; padding:14px 20px; display:flex; align-items:center; gap:18px; }
  .em { font-size:34px; flex:none; }
  .tag { flex:none; width:96px; font-size:15px; font-weight:700; color:#fff; text-align:center;
         border-radius:999px; padding:6px 0; }
  .body b { font-size:16px; display:block; }
  .body span { font-size:13px; color:#64748b; display:block; margin-top:2px; line-height:1.55; }
</style>
</head>
<body>
<div class="canvas">

  <div class="row">
    <span class="em">☕</span><span class="tag" style="background:#16a34a">后端</span>
    <div class="body"><b>Java 17 + Spring Boot 3 + MyBatis-Plus</b>
    <span>生态最成熟，遇到问题好搜答案；学校学的就是 Java，不用边学语言边做项目</span></div>
  </div>

  <div class="row">
    <span class="em">🖥️</span><span class="tag" style="background:#2563eb">网站</span>
    <div class="body"><b>Vue 3 + Vite</b>
    <span>上手快，热更新体验好，社区资料多</span></div>
  </div>

  <div class="row">
    <span class="em">🛠️</span><span class="tag" style="background:#64748b">管理后台</span>
    <div class="body"><b>Vue 3 + Element Plus + ECharts</b>
    <span>中后台系统的「标准答案」，表格、表单、图表都是现成的</span></div>
  </div>

  <div class="row">
    <span class="em">📱</span><span class="tag" style="background:#07c160">小程序</span>
    <div class="body"><b>uni-app（Vue3 语法）</b>
    <span>一套代码既能编译成微信小程序，也能出 H5；以后要做 App 还能接着用</span></div>
  </div>

  <div class="row">
    <span class="em">🐬</span><span class="tag" style="background:#ea580c">数据库</span>
    <div class="body"><b>MySQL 8</b>
    <span>免费、稳定、教程多，个人项目首选</span></div>
  </div>

</div>
</body>
</html>
