<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f8fafc; padding:36px; color:#1e293b; }
  .canvas { width:1000px; margin:0 auto; }
  .main { display:flex; align-items:center; justify-content:center; gap:10px; }
  .state { color:#fff; border-radius:999px; padding:14px 26px; text-align:center; font-size:16px; font-weight:700; }
  .state small { display:block; font-size:11.5px; font-weight:400; opacity:.92; margin-top:2px; }
  .s1 { background:#f59e0b; } .s2 { background:#16a34a; } .s3 { background:#0e7490; } .s4 { background:#14532d; }
  .sa { text-align:center; font-size:17px; color:#475569; font-weight:700; }
  .sa small { display:block; font-size:11px; color:#64748b; font-weight:400; max-width:110px; }
  .branches { display:flex; gap:14px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .b { border:2px dashed #cbd5e1; border-radius:14px; padding:11px 18px; font-size:14px; color:#475569;
       background:#fff; display:flex; align-items:center; gap:9px; line-height:1.6; }
  .pill { color:#fff; border-radius:999px; padding:4px 14px; font-size:13px; font-weight:700; white-space:nowrap; }
</style>
</head>
<body>
<div class="canvas">
  <div class="main">
    <div class="state s1">待支付<small>提交订单</small></div>
    <div class="sa">→<small>支付成功</small></div>
    <div class="state s2">待发货<small>商家拣货</small></div>
    <div class="sa">→<small>发货</small></div>
    <div class="state s3">待收货<small>配送中</small></div>
    <div class="sa">→<small>确认收货</small></div>
    <div class="state s4">已完成<small>可评价</small></div>
  </div>
  <div class="branches">
    <div class="b">⏰ 超时 30 分钟未支付 → <span class="pill" style="background:#94a3b8">已取消</span> 库存自动退回</div>
    <div class="b">🍊 申请售后 → <span class="pill" style="background:#ff8c42">售后中</span> → 审核通过 → <span class="pill" style="background:#7c3aed">已退款</span></div>
  </div>
</div>
</body>
</html>
