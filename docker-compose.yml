# 一键起后端全套：MySQL 8 + Spring Boot 后端（Flyway 自动迁移建表/种子）
# 前置：安装 Docker Desktop；用法：docker compose up -d --build
# 敏感项通过环境变量注入（见 .env.example），本地开发可用默认值
services:
  mysql:
    image: mysql:8.0
    container_name: fruit-mysql
    environment:
      MYSQL_DATABASE: fruit_mall
      MYSQL_ROOT_PASSWORD: ${FRUIT_DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    container_name: fruit-backend
    environment:
      FRUIT_DB_HOST: mysql
      FRUIT_DB_PORT: "3306"
      FRUIT_DB_NAME: fruit_mall
      FRUIT_DB_USER: root
      FRUIT_DB_PASSWORD: ${FRUIT_DB_PASSWORD:-123456}
      FRUIT_JWT_SECRET: ${FRUIT_JWT_SECRET:-fruit-mall-dev-jwt-secret-change-me-please-0123456789abcdef}
      FRUIT_WX_APPID: ${FRUIT_WX_APPID:-}
      FRUIT_WX_SECRET: ${FRUIT_WX_SECRET:-}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
